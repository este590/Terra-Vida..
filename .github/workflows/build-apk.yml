- name: Encontrar proyecto Android
  run: |
    echo "Buscando archivos Gradle..."
    find . -name settings.gradle -o -name settings.gradle.kts

- name: Compilar TerraVida
  shell: bash
  run: |
    PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")
    if [ -z "$PROJECT_DIR" ]; then
      echo "ERROR: No se encontró settings.gradle"
      exit 1
    fi
    echo "Proyecto encontrado en: $PROJECT_DIR"
    cd "$PROJECT_DIR"
    gradle --no-daemon assembleDebug

- name: Guardar APK
  uses: actions/upload-artifact@v4
  with:
    name: TerraVida-APK
    path: '**/build/outputs/apk/debug/app-debug.apk'
    if-no-files-found: error
    retention-days: 14
